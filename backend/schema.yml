openapi: 3.0.3
info:
  title: LMS Platform API
  version: 1.0.0
  description: REST API for LMS Platform (Super Admin) & Library Dashboard
paths:
  /api/v1/auth/avatar/:
    post:
      operationId: api_v1_auth_avatar_create
      description: Upload or replace the authenticated user's avatar image.
      tags:
      - Auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/change-password/:
    post:
      operationId: api_v1_auth_change_password_create
      description: Change password for the currently authenticated user.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/forgot-password/:
    post:
      operationId: api_v1_auth_forgot_password_create
      description: Generate and email a password reset token & OTP to the user.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/legacy/avatar/:
    post:
      operationId: api_v1_auth_legacy_avatar_create
      description: Upload or replace the authenticated user's avatar image.
      tags:
      - Auth
